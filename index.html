<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vlorio</title>
<meta name="description" content="Vlorio — aplikacije i njihove politike privatnosti.">
<style>
  :root { --bg: #0e0e10; --surface: #17171a; --border: #2a2a2e; --text: #f4f4f5; --muted: #a1a1aa; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 64px 16px; }
  h1 { font-size: 40px; letter-spacing: -.02em; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 48px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  .app { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 16px; }
  .app h3 { margin: 0 0 4px; font-size: 18px; }
  .app p { margin: 0 0 12px; color: var(--muted); font-size: 15px; }
  .links { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 15px; }
  a { color: var(--text); text-underline-offset: 3px; }
  a:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  footer { margin-top: 48px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Vlorio</h1>
  <p class="lead">Aplikacije koje pravim.</p>

  <h2>Aplikacije</h2>
  <div class="app">
    <h3>Underground Fight Club</h3>
    <p>Treninzi, dolasci i uplate za boks i kik-boks klub iz Pirota.</p>
    <div class="links">
      <a href="underground/privatnost.html">Politika privatnosti</a>
      <a href="underground/brisanje-naloga.html">Brisanje naloga</a>
    </div>
  </div>

  <footer>Kontakt: <a href="mailto:perica.joncic97@gmail.com">perica.joncic97@gmail.com</a></footer>
</main>
</body>
</html>
